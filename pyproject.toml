[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-week-3"
version = "1.0.0"
description = "RAG application with hybrid retrieval, reranking, and MMR."
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn[standard]", "python-multipart", "pypdf", "sentence-transformers", "pinecone", "python-dotenv", "ollama", "rank-bm25", "numpy", "pytesseract", "Pillow", "jinja2"]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
