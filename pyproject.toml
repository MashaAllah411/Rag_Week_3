[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-week-3"
version = "2.0.0"
description = "Production-style Insurance Policy & Claims RAG application with hybrid retrieval, reranking, agent triage, MCP, multi-agent (A2A) and OpenTelemetry observability - open-source tooling throughout."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pypdf",
    "sentence-transformers",
    "chromadb",
    "rank-bm25",
    "ollama",
    "python-dotenv",
    "numpy",
    "pandas",
    "pytesseract",
    "Pillow",
    "streamlit",
    "requests",
    "httpx",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "reportlab"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
