version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: docchat_backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.45}
    volumes:
      - ./data:/app/data
      - ./resources:/app/resources
      - ./traces:/app/traces
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: docchat_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Optional local Ollama container when running offline without Groq API
  ollama:
    image: ollama/ollama:latest
    container_name: docchat_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    profiles:
      - local-llm

volumes:
  ollama_models:
